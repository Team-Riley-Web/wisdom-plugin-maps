# FabFilter Pro-C 2: plug-in identity and parameter data for hosts (Wisdom Pro reads it).
format = 1
revision = 1

sources = [
  "Identity: the Audio Unit's component description and version (Info.plist)",
  "VST3 class id: the VST3 scan; parameters compared with the AU on one Mac with both installed",
  "CLAP id: the CLAP plug-in factory's descriptor",
  "Calibration: measured by Wisdom Pro on the installed plug-in by rendering test signals",
]

[plugin]
name = "Pro-C 2"
vendor = "FabFilter"
type = "dynamics"
roles = ["compressor"]
tested_versions = ["2.20"]

[formats.au]
type = "aumf"
subtype = "FC2p"
manufacturer = "FabF"

[formats.vst3]
class_id = "79F415E3C8E74807AD5DA3CF7024F618"
matches_au = true

[formats.clap]
id = "com.FabFilter.preset-discovery.Pro-C.2"

[[controls]]
role = "ratio"
param = "Ratio"
calibration = "ratio"

[[controls]]
role = "attack"
param = "Attack"
calibration = "attack_ms"

[[controls]]
role = "release"
param = "Release"
calibration = "release_ms"

# x: the static ratio (x:1) the control gives.
[calibration.ratio]
x = "ratio"
method = "A 4 kHz sine stepped from -30 to -20 dBFS (static ratio) and from -70 to -20 dBFS and back (time to 63 % of the gain reduction on the way in, 37 % on the way out); Style Clean, knee 0, no lookahead. Attack stops rising near 53 ms at control 0.9, so its table ends there"
