# TBTECH Cenozoix Compressor: plug-in identity and parameter data for hosts (Wisdom Pro reads it).
format = 1
revision = 1

sources = [
  "Identity: the Audio Unit's component description and version (Info.plist)",
  "VST3 class id: the VST3 scan; parameters compared with the AU on one Mac with both installed",
  "Calibration: measured by Wisdom Pro on the installed plug-in by rendering test signals",
]

[plugin]
name = "Cenozoix Compressor"
vendor = "TBTECH"
type = "dynamics"
roles = ["compressor"]
tested_versions = ["1.1.1"]

[formats.au]
type = "aufx"
subtype = "0a6i"
manufacturer = "Tbtc"

[formats.vst3]
class_id = "56535430613669746274656368206365"
matches_au = true

[[controls]]
role = "ratio"
param = "Ratio"
calibration = "ratio"

[[controls]]
role = "attack"
param = "Att Time"
calibration = "attack_ms"

[[controls]]
role = "release"
param = "Rel Time"
calibration = "release_ms"

# x: the static ratio (x:1) the control gives.
[calibration.ratio]
x = "ratio"
method = "A 4 kHz sine stepped from -30 to -20 dBFS (static ratio) and from -70 to -20 dBFS and back (time to 63 % of the gain reduction on the way in, 37 % on the way out); Style Clean, Range 1, Knee 0"
